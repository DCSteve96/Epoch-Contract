# Copia locale di https://github.com/CetusProtocol/integer-mate
# tag mainnet-v1.3.0 (09a12d9b1711…), lo stesso commit che Cetus pinna.
#
# Vendorizzata per lo stesso motivo dell'interfaccia Cetus: gli indirizzi
# cambiano da rete a rete, e con una dipendenza git puntata a un branch non si
# possono cambiare senza forkare. Qui li riscrive `lp_lock_testnet.sh net`.
#
# I valori qui sotto sono presi dalla linkage table on-chain del package Cetus
# CLMM, cioè dalla fonte autoritativa e non da un README: se non coincidono con
# quelli, `I32` sarebbe un tipo diverso da quello che Cetus usa davvero.
[package]
name = "IntegerMate"
version = "1.3.0"
edition = "2024"
published-at = "0xdfaadf86be9af246900d1e3f3b996cf549e7948e662a9977bdd7646d8fa3a778"

[dependencies]

[addresses]
integer_mate = "0x714a63a0dba6da4f017b42d5d0fb78867f18bcde904868e51d951a5a6f5b7f57"
